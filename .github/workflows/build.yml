name: Prueba de Compilacion

on:
  push:
    branches: [ test-compilacion ]

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SoundGraphy-Linux
            asset_name: SoundGraphy-Linux
          - os: windows-latest
            artifact_name: SoundGraphy.exe
            asset_name: SoundGraphy-Windows.exe
          - os: macos-latest
            artifact_name: SoundGraphy
            asset_name: SoundGraphy-Mac

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pyinstaller
      shell: bash

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --onefile --windowed SoundGraphy.py
      shell: bash

    - name: Renombrar archivo (Windows/Linux)
      if: matrix.os != 'macos-latest'
      run: |
        mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}
      shell: bash

    - name: Preparar App de Mac
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r ../SoundGraphy-Mac.zip SoundGraphy.app
      shell: bash

    - name: Guardar Ejecutable de Prueba
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: |
          dist/SoundGraphy-Linux
          dist/SoundGraphy-Windows.exe
          SoundGraphy-Mac.zip
