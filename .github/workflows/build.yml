name: Crear Release Oficial

on:
  push:
    tags:
      - 'v*' # Se activará solo cuando subas un tag que empiece con 'v' (ej. v1.0.0)

permissions:
  contents: write

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SoundGraphy-Linux
            icon_param: ""
            path_sep: ":"
          - os: windows-latest
            artifact_name: SoundGraphy-Windows.exe # Añadimos la extensión aquí para automatizar
            icon_param: "--icon=logo/logo.ico"
            path_sep: ";"
          - os: macos-latest
            artifact_name: SoundGraphy-Mac.app
            icon_param: "--icon=logo/logo.icns"
            path_sep: ":"

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v7

    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pyinstaller
      shell: bash

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed \
          ${{ matrix.icon_param }} \
          --name="SoundGraphy" \
          --add-data="logo${{ matrix.path_sep }}logo" \
          --collect-all="customtkinter" \
          main.py
      shell: bash

    - name: Preparar Binarios
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          # Mac empaqueta el .app generado
          zip -r ../SoundGraphy-Mac.zip SoundGraphy.app
        elif [ "${{ matrix.os }}" = "windows-latest" ]; then
          # Para Windows empaquetamos la carpeta distribuida con sus dependencias
          cd SoundGraphy
          zip -r ../../SoundGraphy-Windows.zip .
        else
          # Para Linux empaquetamos el directorio distribuible
          cd SoundGraphy
          tar -czf ../../SoundGraphy-Linux.tar.gz .
        fi
      shell: bash

    - name: Subir a la Release de GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          SoundGraphy-Linux
          SoundGraphy-Windows.exe
          SoundGraphy-Mac.zip
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}